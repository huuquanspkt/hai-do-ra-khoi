<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14324f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Hải đồ, định vị, dự báo sóng gió và dẫn đường cho tàu cá — bản mẫu tham khảo.">
  <title>Hải Đồ Ra Khơi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Bản đồ phủ toàn màn hình -->
<div id="ban-do" aria-label="Bản đồ biển"></div>

<!-- Thanh tin bão (ưu tiên cao nhất) -->
<div id="thanh-bao" class="thanh-bao" role="status">
  <span class="dau" id="thanh-bao-dau">✓</span>
  <span id="thanh-bao-chu">Đang hỏi tin bão…</span>
</div>

<!-- Thẻ vị trí tàu và điểm đích -->
<section id="the-vi-tri" class="the-vi-tri" aria-label="Vị trí tàu và điểm đích">
  <span class="nhan">TÀU</span>
  <span class="gia-tri" id="vi-tri-tau">Chưa bật GPS</span>
  <span class="nhan">ĐÍCH</span>
  <span class="gia-tri" id="vi-tri-dich">Chưa chọn</span>
  <span class="phu" id="vi-tri-phu">Chạm "Bật GPS" để bắt đầu</span>
</section>

<!-- Cột nút bên phải -->
<nav id="cot-nut" class="cot-nut" aria-label="Điều khiển bản đồ">
  <button id="nut-lop" aria-label="Hiện lớp bản đồ">
    <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 13 10 5 10-5"/></svg>
    <span>Lớp bản đồ</span>
  </button>
  <button id="nut-gps" aria-label="Vị trí của tôi (GPS)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    <span id="nut-gps-chu">Bật GPS</span>
  </button>
  <button id="nut-chay" aria-label="Bắt đầu chạy — máy đọc cảnh báo theo vị trí tàu">
    <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
    <span id="nut-chay-chu">Bắt đầu chạy</span>
  </button>
  <button id="nut-den-diem" aria-label="Đến điểm — nhập toạ độ">
    <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
    <span>Đến điểm</span>
  </button>
  <button id="nut-diem-luu" aria-label="Điểm đã lưu">
    <svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9L12 3z"/></svg>
    <span>Điểm đã lưu</span>
  </button>
  <button id="nut-lo-trinh" aria-label="Dẫn đường — mở bảng tính lộ trình">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h4a4 4 0 0 0 0-8h-2a4 4 0 0 1 0-8h6"/></svg>
    <span>Lộ trình</span>
  </button>
</nav>

<!-- Nhãn nổi -->
<div id="nhan-ranh-gioi" class="nhan-noi an-toan" hidden></div>
<button id="goi-ngoai-tuyen" class="nhan-noi" aria-label="Xem dữ liệu đã lưu để đi biển" hidden></button>

<!-- Dải dưới: tab ngày, sóng gió, thanh tab chính -->
<footer class="dai-duoi">
  <div id="tab-ngay" class="tab-ngay" role="tablist" aria-label="Chọn ngày xem dự báo"></div>
  <button id="song-gio" class="song-gio" aria-label="Xem chi tiết gió sóng tại điểm đang xem">
    <span class="i">i</span>
    <span class="mui-ten" id="song-gio-mui-ten" hidden>↑</span>
    <span class="chu" id="song-gio-chu">Chưa có dữ liệu sóng gió</span>
  </button>
  <nav class="thanh-tab" aria-label="Điều hướng chính">
    <button data-tab="trang-chu"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>Trang chủ</button>
    <button data-tab="ra-khoi" class="bat"><svg viewBox="0 0 24 24"><path d="M3 12c3-4 7-6 11-6l4 6-4 6c-4 0-8-2-11-6z"/><path d="m18 6 3 6-3 6"/></svg>Ra khơi</button>
    <button data-tab="tau-ca"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 13a7 7 0 0 0 14 0M3 13h4M17 13h4"/></svg>Tàu cá</button>
    <button data-tab="ban-thuyen"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 15a5 5 0 0 1 6 5"/></svg>Bạn thuyền</button>
    <button data-tab="giao-dich"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 6.5a4 4 0 0 0-4-2.5h-2a3.5 3.5 0 0 0 0 7h2a3.5 3.5 0 0 1 0 7h-2a4 4 0 0 1-4-2.5"/></svg>Giao dịch</button>
  </nav>
</footer>

<!-- Bảng trượt dùng chung cho mọi hộp thoại -->
<section id="bang-truot" class="bang-truot" role="dialog" aria-modal="false" hidden></section>

<!-- Thư viện bản đồ (UMD, định nghĩa biến toàn cục L) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Mã của app (ES module, tự chạy sau khi trang tải xong) -->
<script type="module" src="js/app.js"></script>
</body>
</html>
